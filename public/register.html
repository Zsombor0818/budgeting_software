<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
<form id="loginForm">
    <span id="errorMsg"></span>
    <input id="username" name="username" type="text" placeholder="Felhasználónév">
    <input id="email" name="email" type="email" placeholder="Email cím">
    <input id="password" name="password" type="password" placeholder="Jelszó">
    <input id="password_again" name="password_again" type="password" placeholder="Jelszó újra">        
    <button type="submit">Bejelentkezés</button>
</form>
</body>
<script>
    const form = document.getElementById("loginForm");
    const usernameInput = document.getElementById("username");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
     const passwordAgainInput = document.getElementById("password_again");
    const errorMsg = document.getElementById("errorMsg");
    form.addEventListener("submit", async (e) => {
        e.preventDefault();
    const response = await fetch("/api/register", {
    method: "POST",
    headers: {
        "Content-Type": "application/json"
    },
    body: JSON.stringify({
        username: usernameInput.value,
        email: emailInput.value,
        password: passwordInput.value,
        password_again: passwordAgainInput.value
    })
});

const data = await response.json();

if (!response.ok) {
    if (data.code === "INVALID_CREDENTIALS") {
        usernameInput.classList.add("input-error");
        passwordInput.classList.add("input-error");

        errorMsg.textContent = data.message;
        errorMsg.style.display = "block";
    }

    return;
}
window.location.href = "/login" 

    })
</script>
</html>
