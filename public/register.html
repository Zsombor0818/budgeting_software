<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Közös Kassza – Regisztráció</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body data-page="register">
<div class="auth">
  <aside class="auth-side">
    <div class="brand"><i><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h14a2 2 0 012 2v9a2 2 0 01-2 2H6a2 2 0 01-2-2V7z"/><path d="M4 7l11-3v3"/></svg></i>Közös Kassza</div>
    <div><h2>Kezdjük el együtt!</h2><p>Bevételek és kiadások egy helyen, a családod minden tagjával.</p></div>
    <small>Költségvetéskészítő webalkalmazás</small>
  </aside>
  <main class="auth-main">
    <form class="auth-form" id="authForm" novalidate>
      <h1>Regisztráció</h1>
      <p class="err" id="errorMsg" role="alert"></p>
      <label>Felhasználónév<input id="username" name="username" type="text" autocomplete="username" required></label>
      <label>Email cím<input id="email" name="email" type="email" autocomplete="email" required></label>
      <label>Jelszó<input id="password" name="password" type="password" autocomplete="new-password" required></label>
      <label>Jelszó újra<input id="password_again" name="password_again" type="password" autocomplete="new-password" required></label>
      <button class="btn primary" type="submit">Fiók létrehozása</button>
      <p class="alt">Már van fiókod? <a href="/login">Bejelentkezés</a></p>
    </form>
  </main>
</div>
<script src="/js/app.js"></script>
</body>
</html>
